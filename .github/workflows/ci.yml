name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Check, build and validate (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Verify GM soundfont manifest
        run: npm run test:manifest
      - name: Validation suite (document, performance, reader and large score on chromium)
        run: npm run test:validation
        timeout-minutes: 10
      - name: Pack smoke test (npm pack into fresh Vite, Astro static and Astro SSR apps, serving the SSR one on 127.0.0.1; installs from the npm registry, uploads nothing)
        run: npm run test:pack
        timeout-minutes: 12

  reader:
    name: Reader (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # chromium runs in the validate job via test:validation.
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Build
        run: npm run build
      - name: Reader validation
        run: npm run test:reader
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Chunked engraving
        run: npm run test:chunks
        timeout-minutes: 4
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Embedding
        run: npm run test:embed
        timeout-minutes: 4
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Layout (explicit bars per line, no re-engrave loop)
        run: npm run test:layout
        timeout-minutes: 4
        env:
          BROWSER: ${{ matrix.browser }}
