name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '.ph-orch.json', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', '*.md', '.ph-orch.json', '.claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Check, build and validate (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Match playwright-core so Chromium and its system libraries are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright-core install chromium
      - name: Install Poppler for PDF raster validation
        run: |
          apt-get update
          apt-get install -y poppler-utils
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Verify GM soundfont manifest
        run: npm run test:manifest
      - name: Validation suite (document, performance, reader and large score on chromium)
        run: npm run test:validation
        timeout-minutes: 25
      - name: Pack smoke test (npm pack into fresh Vite, Astro static and Astro SSR apps, serving the SSR one on 127.0.0.1; installs from the npm registry, uploads nothing)
        run: npm run test:pack
        timeout-minutes: 12

  reader:
    if: github.event_name != 'push'
    name: Reader (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Playwright image carries the browsers and every system library they need. Installing those libraries with
    # apt on the runner (`--with-deps`, ~120 MB for WebKit or Firefox) has crawled at ~50 kB/s from the runner's mirror
    # and run into the job timeout. Keep the tag on the lockfile's playwright-core version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # Firefox refuses to start as root with another user's HOME (the container runs as root).
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        # chromium runs in the validate job via test:validation.
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A no-op while the image matches playwright-core; after a bump it downloads the new browser build.
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright-core install ${{ matrix.browser }}
      - name: Build
        run: npm run build
      - name: Reader validation
        run: npm run test:reader
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Chunked engraving
        run: npm run test:chunks
        timeout-minutes: 4
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Embedding
        run: npm run test:embed
        timeout-minutes: 4
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Layout (explicit bars per line, no re-engrave loop)
        run: npm run test:layout
        timeout-minutes: 4
        env:
          BROWSER: ${{ matrix.browser }}
